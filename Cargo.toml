[package]
name = "raw-speed-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fine-grained internet speed test against Cloudflare's public endpoints"
publish = false

[[bin]]
name = "raw-speed-test"
path = "src/main.rs"

[dependencies]
# UI: immediate-mode egui, GPU-rendered through OpenGL (glow). Chosen over
# the wgpu/Metal renderer because Metal writes a per-app shader cache to
# disk; see CLAUDE.md. No default fonts (the system UI font is loaded at
# runtime) and no persistence (it would write window state to disk).
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "accesskit",
    "x11",
    "wayland",
] }
# TLS for the hand-rolled HTTP/1.1 client, which needs per-phase timing that
# no high-level HTTP crate exposes. `ring` is the smallest crypto provider.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Mozilla root certificates compiled into the binary: no keychain or file
# access needed to verify speed.cloudflare.com.
webpki-roots = "1"
# Raw socket options (TCP_INFO, ICMP, getifaddrs, routing sysctl).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Objective-C runtime bindings: the CLAUDE.md-mandated way to reach AppKit
# and CoreWLAN. Already in the tree through winit; features kept minimal.
objc2 = "0.6"
# Strings, dictionaries, NSUserDefaults registration domain, bundle info.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSURL",
    "NSValue",
    "NSDictionary",
    "NSUserDefaults",
    "NSObject",
    "NSSet",
    "NSData",
    "NSEnumerator",
    "NSBundle",
    "NSProcessInfo",
    "NSAttributedString",
    "NSGeometry",
] }
# Save panel for Export, window restoration switches, and the optional menu
# bar item (status item, its menu, fonts and attributed titles).
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSSavePanel",
    "NSPanel",
    "NSView",
    "NSRunningApplication",
    "NSWindowRestoration",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSButton",
    "NSControl",
    "NSCell",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSFont",
    "NSFontDescriptor",
    "NSAttributedString",
    "NSParagraphStyle",
    "NSText",
    "NSColor",
] }
# Wi-Fi metrics (RSSI, noise, channel, PHY mode, transmit rate).
objc2-core-wlan = { version = "0.3", default-features = false, features = [
    "std",
    "CWWiFiClient",
    "CWInterface",
    "CWChannel",
    "CoreWLANTypes",
] }

[target.'cfg(windows)'.dependencies]
# Win32 bindings for the native Windows shell: windows and common controls
# (v6, through the embedded manifest), Direct2D and DirectWrite for the
# charts, DWM for the dark title bar and Mica, the notification-area icon
# and IFileSaveDialog, and registry reads of the theme and accent colour.
# Already in the tree through accesskit_windows; features kept to the
# modules the shell calls.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `Vector2`, the point type the Direct2D bindings take. Part of the windows
# crate family and already in the tree as a dependency of `windows`, which
# doesn't re-export it.
windows-numerics = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
# Dependencies (egui, rustls) are painfully slow unoptimized.
opt-level = 2
